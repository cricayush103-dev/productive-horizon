</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><div class="logo-icon">PH</div><div><h2>Productive</h2><span>Horizon</span></div></div>
<nav>
<p class="nav-title">WORKSPACE</p>
<a class="nav-item" href="index.html"><i class="fa-solid fa-chart-pie"></i>Dashboard</a>
<a class="nav-item" href="index.html#tasks"><i class="fa-solid fa-list-check"></i>Tasks</a>
<a class="nav-item" href="subjects.html"><i class="fa-solid fa-book"></i>Subjects</a>
<a class="nav-item" href="planner.html"><i class="fa-solid fa-calendar"></i>Planner</a>
<a class="nav-item" href="timer.html"><i class="fa-solid fa-clock"></i>Study Timer</a>
<p class="nav-title">PROGRESS</p>
<a class="nav-item" href="analytics.html"><i class="fa-solid fa-chart-line"></i>Analytics</a>
<a class="nav-item" href="revisions.html"><i class="fa-solid fa-rotate"></i>Revisions</a>

<div class="sidebar-bottom">
<a class="nav-item active" href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
</div>
</aside>
<main class="main">
<header>
<div><p class="small-text">PREFERENCES</p><h1>Settings ⚙️</h1><p class="subtitle">Exam, study goal and Pomodoro preferences.</p></div>
<div class="header-actions"><button class="icon-button" id="moduleThemeButton" type="button">🌙</button></div>
</header>
<section class="module-panel">
<form class="module-form-grid" id="settingsForm">
<div><label class="module-label">Exam Name</label><input class="module-input" id="examName" placeholder="DSSSB TGT Computer Science"/></div>
<div><label class="module-label">Exam Date</label><input class="module-input" id="examDate" type="date"/></div>
<div><label class="module-label">Daily Study Goal (minutes)</label><input class="module-input" id="dailyGoal" min="1" type="number" value="480"/></div>
<div><label class="module-label">Pomodoro Study (minutes)</label><input class="module-input" id="pomodoroStudySetting" min="1" type="number" value="25"/></div>
<div><label class="module-label">Pomodoro Break (minutes)</label><input class="module-input" id="pomodoroBreakSetting" min="1" type="number" value="5"/></div>
<div><label class="module-label">Long Break (minutes)</label><input class="module-input" id="pomodoroLongBreak" min="1" type="number" value="15"/></div>
<div><label class="module-label">Pomodoro Cycles</label><input class="module-input" id="pomodoroCycles" min="1" type="number" value="4"/></div>
<div><label class="module-label">Theme</label><select class="module-select" id="themeSetting"><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="full"><button class="module-btn primary" type="submit">Save Settings</button></div>
</form>
</section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="protected.js"></script>
<script src="module-common.js"></script>
<script src="settings.js"></script>
</body>
</html>
