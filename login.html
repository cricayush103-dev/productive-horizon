<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Productive Horizon
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f6fb;

            color: #111318;
        }


        .login-page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(
                        108,
                        99,
                        255,
                        0.12
                    ),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(
                        80,
                        170,
                        255,
                        0.08
                    ),
                    transparent 30%
                ),

                #f5f6fb;
        }


        .login-card {

            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border:
                1px solid
                #e4e5eb;

            border-radius:
                24px;

            padding:
                38px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        .login-logo {

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                #17181d;

            color:
                #ffffff;

            border-radius:
                15px;

            font-size:
                15px;

            font-weight:
                700;

            margin-bottom:
                25px;
        }


        .login-card h1 {

            font-size:
                28px;

            margin-bottom:
                8px;
        }


        .login-subtitle {

            color:
                #777985;

            font-size:
                14px;

            line-height:
                1.6;

            margin-bottom:
                20px;
        }


        .connection-status {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            font-size:
                11px;

            padding:
                7px 10px;

            border-radius:
                20px;

            margin-bottom:
                10px;
        }


        .status-loading {

            background:
                #f2f2f6;

            color:
                #777985;
        }


        .status-ready {

            background:
                #eaf8ef;

            color:
                #198754;
        }


        .status-error {

            background:
                #ffecec;

            color:
                #dc3545;
        }


        .login-card label {

            display:
                block;

            margin-top:
                17px;

            margin-bottom:
                8px;

            font-size:
                13px;

            font-weight:
                600;
        }


        .login-card input {

            display:
                block;

            width:
                100%;

            height:
                48px;

            padding:
                0 14px;

            border:
                1px solid
                #dedfe6;

            border-radius:
                11px;

            background:
                #fafafd;

            color:
                #111318;

            font-size:
                14px;

            outline:
                none;
        }


        .login-card input:focus {

            border-color:
                #6c63ff;

            background:
                white;

            box-shadow:
                0 0 0 3px
                rgba(
                    108,
                    99,
                    255,
                    0.10
                );
        }


        .login-button {

            display:
                block;

            width:
                100%;

            height:
                48px;

            margin-top:
                25px;

            border:
                none;

            border-radius:
                11px;

            background:
                #17181d;

            color:
                white;

            font-size:
                14px;

            font-weight:
                600;

            cursor:
                pointer;
        }


        .login-button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;
        }


        .login-message {

            min-height:
                18px;

            margin-top:
                17px;

            text-align:
                center;

            font-size:
                13px;

            line-height:
                1.4;
        }


        .error-message {
            color:
                #dc3545;
        }


        .success-message {
            color:
                #198754;
        }


        @media (
            max-width: 500px
        ) {

            .login-page {
                padding:
                    18px;
            }


            .login-card {

                padding:
                    28px 22px;

                border-radius:
                    20px;
            }


            .login-card h1 {
                font-size:
                    24px;
            }

        }

    </style>


    <!-- PRIMARY CDN -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        onerror="
            this.onerror=null;
            this.src='https://unpkg.com/@supabase/supabase-js@2';
        "
    ></script>

</head>


<body>


    <main class="login-page">


        <section class="login-card">


            <div class="login-logo">
                PH
            </div>


            <h1>
                Productive Horizon
            </h1>


            <p class="login-subtitle">
                Sign in to your personal productivity workspace.
            </p>


            <div
                id="loginStatus"
                class="
                    connection-status
                    status-loading
                "
            >
                Checking secure connection...
            </div>


            <form id="loginForm">


                <label for="loginEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>


            </form>


            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>


        </section>


    </main>


    <script src="supabase.js"></script>

    <script src="auth.js"></script>


</body>

</html>
