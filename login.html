<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Productive Horizon</title>

    <!-- Existing main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- =========================================
         LOGIN PAGE STYLING
    ========================================== -->
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f6fb;
            color: #111318;
        }


        /* =========================================
           LOGIN PAGE
        ========================================== */

        .login-page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(108, 99, 255, 0.12),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(80, 170, 255, 0.08),
                    transparent 30%
                ),
                #f5f6fb;
        }


        /* =========================================
           LOGIN CARD
        ========================================== */

        .login-card {

            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border: 1px solid #e4e5eb;

            border-radius: 24px;

            padding: 38px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.08);
        }


        /* =========================================
           LOGO
        ========================================== */

        .login-logo {

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #17181d;
            color: #ffffff;

            border-radius: 15px;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 0.5px;

            margin-bottom: 25px;
        }


        /* =========================================
           TITLE
        ========================================== */

        .login-card h1 {

            margin: 0 0 8px;

            font-size: 28px;
            line-height: 1.2;

            font-weight: 700;

            color: #111318;
        }


        .login-subtitle {

            margin: 0 0 28px;

            color: #777985;

            font-size: 14px;
            line-height: 1.6;
        }


        /* =========================================
           FORM
        ========================================== */

        .login-card form {
            width: 100%;
        }


        .login-card label {

            display: block;

            margin-top: 17px;
            margin-bottom: 8px;

            color: #34363d;

            font-size: 13px;
            font-weight: 600;
        }


        /* =========================================
           INPUTS
        ========================================== */

        .login-card input {

            display: block;

            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #dedfe6;

            border-radius: 11px;

            background: #fafafd;

            color: #111318;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .login-card input::placeholder {
            color: #a0a2aa;
        }


        .login-card input:focus {

            border-color: #6c63ff;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(108, 99, 255, 0.10);
        }


        /* =========================================
           SIGN IN BUTTON
        ========================================== */

        .login-button {

            display: block;

            width: 100%;
            height: 48px;

            margin-top: 25px;

            border: none;

            border-radius: 11px;

            background: #17181d;

            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                box-shadow 0.15s ease;
        }


        .login-button:hover {

            opacity: 0.92;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.12);
        }


        .login-button:active {
            transform: scale(0.99);
        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =========================================
           LOGIN MESSAGE
        ========================================== */

        .login-message {

            min-height: 18px;

            margin-top: 17px;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;
        }


        .error-message {
            color: #dc3545;
        }


        .success-message {
            color: #198754;
        }


        /* =========================================
           SMALL SCREEN / IPAD / MOBILE
        ========================================== */

        @media (max-width: 500px) {

            .login-page {
                padding: 18px;
            }

            .login-card {

                padding: 28px 22px;

                border-radius: 20px;
            }

            .login-card h1 {
                font-size: 24px;
            }

            .login-subtitle {
                font-size: 13px;
            }

        }

    </style>


    <!-- Supabase JavaScript Library -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

</head>


<body>


    <!-- =========================================
         PRODUCTIVE HORIZON LOGIN
    ========================================== -->

    <main class="login-page">


        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">
                PH
            </div>


            <!-- TITLE -->

            <h1>
                Productive Horizon
            </h1>


            <p class="login-subtitle">
                Sign in to your personal productivity workspace.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="loginPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>


            </form>


            <!-- ERROR / SUCCESS MESSAGE -->

            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>


        </section>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <!-- Our Supabase configuration -->
    <script src="supabase.js"></script>

    <!-- Login authentication -->
    <script src="auth.js"></script>


</body>

</html>
