<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>Journal | Productive Horizon</title>
<link href="style.css" rel="stylesheet"/>
<link href="modules.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><div class="logo-icon">PH</div><div><h2>Productive</h2><span>Horizon</span></div></div>
<nav>
<p class="nav-title">WORKSPACE</p>
<a class="nav-item" href="index.html"><i class="fa-solid fa-chart-pie"></i>Dashboard</a>
<a class="nav-item" href="index.html#tasks"><i class="fa-solid fa-list-check"></i>Tasks</a>
<a class="nav-item" href="subjects.html"><i class="fa-solid fa-book"></i>Subjects</a>
<a class="nav-item" href="planner.html"><i class="fa-solid fa-calendar"></i>Planner</a>
<a class="nav-item" href="timer.html"><i class="fa-solid fa-clock"></i>Study Timer</a>
<p class="nav-title">PROGRESS</p>
<a class="nav-item" href="analytics.html"><i class="fa-solid fa-chart-line"></i>Analytics</a>
<a class="nav-item" href="revisions.html"><i class="fa-solid fa-rotate"></i>Revisions</a>
<a class="nav-item" href="weak-topics.html"><i class="fa-solid fa-triangle-exclamation"></i>Weak Topics</a>
<a class="nav-item active" href="journal.html"><i class="fa-solid fa-book-open"></i>Journal</a>
</nav>
<div class="sidebar-bottom">
<a class="nav-item" href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
</div>
</aside>
<main class="main">
<header>
<div><p class="small-text">DAILY REFLECTION</p><h1>Journal 📖</h1><p class="subtitle">Track focus, energy, wins and problems without overthinking it.</p></div>
<div class="header-actions"><button class="icon-button" id="moduleThemeButton" type="button">🌙</button></div>
</header>
<section class="module-panel">
<form class="module-form-grid" id="journalForm">
<div><label class="module-label">Date</label><input class="module-input" id="journalDate" required="" type="date"/></div>
<div><label class="module-label">Focus Score (1-10)</label><input class="module-input" id="focusScore" max="10" min="1" type="number" value="7"/></div>
<div><label class="module-label">Energy Score (1-10)</label><input class="module-input" id="energyScore" max="10" min="1" type="number" value="7"/></div>
<div></div>
<div class="full"><label class="module-label">What Went Well?</label><textarea class="module-textarea" id="wentWell"></textarea></div>
<div class="full"><label class="module-label">What Went Wrong?</label><textarea class="module-textarea" id="wentWrong"></textarea></div>
<div class="full"><label class="module-label">Notes</label><textarea class="module-textarea" id="journalNotes"></textarea></div>
<div class="full"><button class="module-btn primary" type="submit">Save Journal Entry</button></div>
</form>
</section>
<section class="module-panel"><div class="panel-header"><div><h3>Recent Entries</h3><p>Your daily reflection history</p></div></div><div id="journalList"></div></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="protected.js"></script>
<script src="module-common.js"></script>
<script src="journal.js"></script>
</body>
</html>
